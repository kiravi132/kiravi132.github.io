<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой сайт с фотографией</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
        }

        .container {
            padding: 40px 20px;
        }

        img {
            max-width: 90%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        p {
            font-size: 18px;
            color: #555;
            margin-top: 20px;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            background-color: #222;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h1>Добро пожаловать на мой сайт</h1>
</header>

<div class="container">
    <img src="photo.jpg" alt="Фотография">
    <p>Фотография добавлена на страницу сайта.</p>
</div>

<footer>
    © 2026 Мой сайт
</footer>

</body>
</html>
