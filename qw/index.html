<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ЧУРКА?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        .fullscreen-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .strobe {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rgb-strobe 0.08s infinite alternate;
        }

        @keyframes rgb-strobe {
            0%   { background-color: #ff0000; }
            15%  { background-color: #ff2200; }
            30%  { background-color: #00ff22; }
            45%  { background-color: #0022ff; }
            60%  { background-color: #ff00cc; }
            75%  { background-color: #ffff00; }
            90%  { background-color: #ff8800; }
            100% { background-color: #ff0044; }
        }

        .churka-text {
            font-family: 'Arial Black', 'Impact', 'Helvetica Bold', sans-serif;
            font-size: min(25vw, 35vh, 300px);
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-shadow: 
                0 0 20px currentColor,
                0 0 40px rgba(255,255,255,0.8),
                4px 4px 0 rgba(0,0,0,0.5);
            user-select: none;
            pointer-events: none;
            z-index: 10;
            animation: text-pulse 0.16s infinite alternate;
        }

        @keyframes text-pulse {
            0%   { transform: scale(1); opacity: 1; text-shadow: 0 0 10px magenta, 0 0 30px cyan; }
            50%  { transform: scale(1.05); opacity: 0.95; text-shadow: 0 0 25px yellow, 0 0 60px red; }
            100% { transform: scale(0.98); opacity: 1; text-shadow: 0 0 15px lime, 0 0 45px blue; }
        }

        .strobe {
            opacity: 1;
            transition: opacity 0.01s;
        }

        .hint {
            position: fixed;
            bottom: 8px;
            right: 12px;
            color: rgba(255,255,255,0.25);
            font-family: monospace;
            font-size: 12px;
            z-index: 999;
            pointer-events: none;
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 20px;
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>

    <div class="fullscreen-container" id="fullscreenEl">
        <div class="strobe">
            <div class="churka-text">ЧУРКА</div>
        </div>
    </div>

    <div class="hint">fullscreen · rgb strobe</div>

    <script>
        (function() {
            const element = document.documentElement;
            
            function enterFullscreen() {
                if (document.fullscreenElement) return;
                
                const requestFullscreen = element.requestFullscreen || 
                                         element.webkitRequestFullscreen || 
                                         element.mozRequestFullScreen || 
                                         element.msRequestFullscreen;
                
                if (requestFullscreen) {
                    requestFullscreen.call(element).catch(err => {
                        console.warn('Fullscreen не сработал автоматически:', err);
                    });
                }
            }

            enterFullscreen();

            const triggerFs = function(e) {
                if (!document.fullscreenElement) {
                    enterFullscreen();
                }
                document.removeEventListener('click', triggerFs);
                document.removeEventListener('touchstart', triggerFs);
                document.removeEventListener('keydown', triggerFs);
            };

            document.addEventListener('click', triggerFs, { once: true });
            document.addEventListener('touchstart', triggerFs, { once: true, passive: true });
            document.addEventListener('keydown', triggerFs, { once: true });

            window.addEventListener('load', function() {
                setTimeout(enterFullscreen, 200);
            });

        })();
    </script>

</body>
</html>
