<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background-color 0.1s linear;
    }

    h1 {
        margin: 0;
        font-family: Arial, sans-serif;
        font-weight: bold;
        font-size: 10vw; /* авто-размер текста */
        text-align: center;
    }
</style>
</head>
<body>

<h1>лох</h1>

<script>
function randomColor() {
    const r = Math.floor(Math.random() * 256);
    const g = Math.floor(Math.random() * 256);
    const b = Math.floor(Math.random() * 256);
    document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
}

setInterval(randomColor, 50); // быстрое изменение цвета
</script>

</body>
</html>
