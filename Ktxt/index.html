<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kira-txt · расписание</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0f2f5 0%, #e0e4e9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* главная карточка с «окантовкой» */
        .kira-container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 32px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.15),
                inset 0 1px 2px rgba(255, 255, 255, 0.6),
                0 0 0 2px rgba(255, 215, 245, 0.5),
                0 0 0 6px rgba(180, 130, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.7);
            transition: box-shadow 0.2s;
        }

        .kira-container:hover {
            box-shadow: 
                0 24px 48px rgba(0, 0, 0, 0.2),
                inset 0 1px 3px white,
                0 0 0 3px #ffb7e4,
                0 0 0 8px #cba6ff;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #1e1e2f, #3a2b4b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1::after {
            content: '✨';
            font-size: 2.2rem;
            background: none;
            -webkit-text-fill-color: initial;
        }

        .sub {
            color: #4a3f5c;
            margin-bottom: 28px;
            font-style: italic;
            border-left: 5px solid #b380ff;
            padding-left: 18px;
            background: rgba(210, 180, 255, 0.2);
            border-radius: 0 20px 20px 0;
        }

        /* форма */
        .event-form {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 40px;
            padding: 26px 24px;
            margin-bottom: 36px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 16px -8px rgba(0,0,0,0.1);
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }

        .form-group {
            flex: 1 1 160px;
            min-width: 140px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #3e2e4a;
            margin-bottom: 6px;
        }

        input, select, button {
            background: white;
            border: 1px solid #e0d0f0;
            border-radius: 40px;
            padding: 12px 20px;
            font-size: 1rem;
            width: 100%;
            outline: none;
            transition: 0.15s;
        }

        input:focus, select:focus {
            border-color: #b380ff;
            box-shadow: 0 0 0 4px rgba(179, 128, 255, 0.2);
        }

        button {
            background: linear-gradient(115deg, #d9c9ff, #b692ff);
            border: none;
            font-weight: 600;
            color: #1d1127;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(130, 80, 200, 0.3);
            transition: 0.15s;
            border: 1px solid rgba(255,255,255,0.5);
            flex: 0 1 auto;
            min-width: 140px;
        }

        button:hover {
            background: linear-gradient(115deg, #c7b0ff, #a57cff);
            box-shadow: 0 8px 16px rgba(130, 80, 200, 0.4);
            transform: scale(1.02);
        }

        .button-group {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .button-group button {
            flex: 1 1 auto;
        }

        .btn-secondary {
            background: rgba(255,255,240,0.8);
            box-shadow: none;
            color: #2a1b35;
            border: 1px solid #cab8e6;
        }

        .btn-secondary:hover {
            background: #f5ecff;
        }

        /* список событий */
        .events-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .event-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 20px 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: 0.15s;
        }

        .event-card:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: #ccaaff;
            box-shadow: 0 12px 20px -12px #b380ff;
        }

        .event-info {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 20px;
        }

        .event-title {
            font-weight: 700;
            font-size: 1.3rem;
            color: #1d1127;
            min-width: 180px;
        }

        .event-day {
            background: #f0e5ff;
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #4a2c64;
        }

        .event-time {
            font-family: 'JetBrains Mono', monospace;
            background: #ffffffc0;
            padding: 5px 14px;
            border-radius: 40px;
            border: 1px dashed #caacff;
        }

        .event-actions {
            display: flex;
            gap: 10px;
        }

        .event-actions button {
            width: 48px;
            height: 48px;
            padding: 0;
            border-radius: 50%;
            background: white;
            border: 1px solid #e0d0f0;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .event-actions button:hover {
            background: #f5ecff;
            border-color: #b380ff;
        }

        .empty-message {
            text-align: center;
            color: #6b5c7a;
            font-style: italic;
            padding: 40px 20px;
            background: rgba(255,255,240,0.4);
            border-radius: 50px;
        }

        .clear-btn {
            background: #ffe8f0;
            color: #a0436b;
            border: 1px solid #ffb3c6;
            box-shadow: none;
        }

        .clear-btn:hover {
            background: #ffdae5;
        }

        footer {
            margin-top: 24px;
            text-align: right;
            color: #685e78;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="kira-container">
    <h1>Kira-txt · расписание</h1>
    <div class="sub">добавляй, меняй, убирай — и получай нежные напоминания ✨</div>

    <!-- Форма для добавления / редактирования -->
    <div class="event-form">
        <div class="form-row">
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="eventTitle" placeholder="например: Йога / Митинг" maxlength="50">
            </div>
            <div class="form-group">
                <label>День</label>
                <select id="eventDay">
                    <option value="0">Воскресенье</option>
                    <option value="1">Понедельник</option>
                    <option value="2">Вторник</option>
                    <option value="3">Среда</option>
                    <option value="4">Четверг</option>
                    <option value="5">Пятница</option>
                    <option value="6">Суббота</option>
                </select>
            </div>
            <div class="form-group">
                <label>Начало</label>
                <input type="time" id="eventStart" value="09:00">
            </div>
            <div class="form-group">
                <label>Конец (необяз.)</label>
                <input type="time" id="eventEnd">
            </div>
        </div>
        <div class="button-group">
            <button id="addEventBtn">➕ Добавить событие</button>
            <button id="updateEventBtn" style="display: none;">✏️ Обновить</button>
            <button id="cancelEditBtn" class="btn-secondary" style="display: none;">Отмена</button>
            <button id="clearAllBtn" class="clear-btn">🧹 Очистить всё</button>
        </div>
    </div>

    <!-- Список событий -->
    <div id="eventsList" class="events-grid">
        <!-- будут заполняться динамически -->
    </div>
    <footer>kira-txt · уведомления за 10 мин до начала</footer>
</div>

<script>
    (function() {
        // --- КЛЮЧ ХРАНИЛИЩА ---
        const STORAGE_KEY = 'kiraSchedule';

        // --- ГЛОБАЛЬНОЕ СОСТОЯНИЕ ---
        let schedule = [];                // массив событий
        let editingId = null;             // id редактируемого события (если есть)
        const notifiedToday = new Map();   // для уведомлений: eventId -> дата-строка (YYYY-MM-DD)

        // --- ЭЛЕМЕНТЫ ФОРМЫ ---
        const titleInput = document.getElementById('eventTitle');
        const daySelect = document.getElementById('eventDay');
        const startInput = document.getElementById('eventStart');
        const endInput = document.getElementById('eventEnd');
        const addBtn = document.getElementById('addEventBtn');
        const updateBtn = document.getElementById('updateEventBtn');
        const cancelBtn = document.getElementById('cancelEditBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const eventsContainer = document.getElementById('eventsList');

        // --- ЗАПРОС РАЗРЕШЕНИЯ НА УВЕДОМЛЕНИЯ ---
        if (Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // --- ЗАГРУЗКА / СОХРАНЕНИЕ ---
        function loadSchedule() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    schedule = JSON.parse(stored);
                    // убедимся, что у каждого события есть id (если старые данные)
                    schedule = schedule.map(ev => ({ ...ev, id: ev.id || Date.now() + Math.random() }));
                } catch (e) {
                    schedule = [];
                }
            } else {
                // пара примеров для первого запуска
                schedule = [
                    { id: '1', title: 'Планёрка', day: 1, start: '10:00', end: '10:30' },
                    { id: '2', title: 'Обед', day: 1, start: '13:00', end: '13:45' },
                    { id: '3', title: 'Тренировка', day: 3, start: '18:30', end: '19:30' },
                ];
            }
            renderEvents();
            saveSchedule();
        }

        function saveSchedule() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule));
        }

        // --- ОТОБРАЖЕНИЕ СПИСКА ---
        function renderEvents() {
            if (schedule.length === 0) {
                eventsContainer.innerHTML = `<div class="empty-message">✨ Пока нет событий. Добавьте что‑нибудь красивое ✨</div>`;
                return;
            }

            // сортировка по дню и времени
            const sorted = [...schedule].sort((a, b) => {
                if (a.day !== b.day) return a.day - b.day;
                return a.start.localeCompare(b.start);
            });

            const daysOfWeek = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
            const fullDays = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];

            let html = '';
            sorted.forEach(ev => {
                const dayName = fullDays[ev.day] || '???';
                const timeRange = ev.end ? `${ev.start} — ${ev.end}` : ev.start;
                html += `
                    <div class="event-card" data-id="${ev.id}">
                        <div class="event-info">
                            <span class="event-title">${escapeHtml(ev.title)}</span>
                            <span class="event-day">${dayName}</span>
                            <span class="event-time">${escapeHtml(timeRange)}</span>
                        </div>
                        <div class="event-actions">
                            <button class="edit-event" title="Редактировать" data-id="${ev.id}">✏️</button>
                            <button class="delete-event" title="Удалить" data-id="${ev.id}">🗑️</button>
                        </div>
                    </div>
                `;
            });
            eventsContainer.innerHTML = html;

            // навешиваем обработчики на кнопки редактирования/удаления
            document.querySelectorAll('.edit-event').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    startEditing(id);
                });
            });

            document.querySelectorAll('.delete-event').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    if (confirm('Удалить событие?')) {
                        deleteEvent(id);
                    }
                });
            });
        }

        // простейший экранирование для безопасности
        function escapeHtml(unsafe) {
            return unsafe.replace(/[&<>"]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                return m;
            });
        }

        // --- ДОБАВЛЕНИЕ НОВОГО СОБЫТИЯ ---
        function addEvent() {
            const title = titleInput.value.trim();
            if (!title) {
                alert('Введите название события');
                return;
            }
            const day = parseInt(daySelect.value, 10);
            const start = startInput.value;
            if (!start) {
                alert('Укажите время начала');
                return;
            }
            const end = endInput.value || ''; // может быть пустым

            const newEvent = {
                id: Date.now() + '-' + Math.random().toString(36).substr(2, 8),
                title,
                day,
                start,
                end,
            };
            schedule.push(newEvent);
            saveSchedule();
            renderEvents();
            clearForm();
        }

        // --- УДАЛЕНИЕ ---
        function deleteEvent(id) {
            schedule = schedule.filter(ev => ev.id !== id);
            // если удалили редактируемое — выходим из режима редактирования
            if (editingId === id) {
                cancelEditing();
            }
            saveSchedule();
            renderEvents();
        }

        // --- РЕДАКТИРОВАНИЕ: заполнить форму ---
        function startEditing(id) {
            const event = schedule.find(ev => ev.id === id);
            if (!event) return;

            editingId = id;
            titleInput.value = event.title;
            daySelect.value = event.day;
            startInput.value = event.start;
            endInput.value = event.end || '';

            addBtn.style.display = 'none';
            updateBtn.style.display = 'inline-block';
            cancelBtn.style.display = 'inline-block';
        }

        // --- ОБНОВЛЕНИЕ СОБЫТИЯ ---
        function updateEvent() {
            if (!editingId) return;

            const title = titleInput.value.trim();
            if (!title) {
                alert('Введите название');
                return;
            }
            const day = parseInt(daySelect.value, 10);
            const start = startInput.value;
            if (!start) {
                alert('Укажите время начала');
                return;
            }
            const end = endInput.value || '';

            const index = schedule.findIndex(ev => ev.id === editingId);
            if (index === -1) return;

            schedule[index] = {
                ...schedule[index],
                title,
                day,
                start,
                end,
            };

            saveSchedule();
            renderEvents();
            cancelEditing();
        }

        // --- ОТМЕНА РЕДАКТИРОВАНИЯ ---
        function cancelEditing() {
            editingId = null;
            clearForm();
            addBtn.style.display = 'inline-block';
            updateBtn.style.display = 'none';
            cancelBtn.style.display = 'none';
        }

        function clearForm() {
            titleInput.value = '';
            daySelect.value = '1';   // понедельник по умолчанию
            startInput.value = '09:00';
            endInput.value = '';
        }

        // --- ОЧИСТКА ВСЕГО РАСПИСАНИЯ ---
        function clearAll() {
            if (schedule.length === 0) return;
            if (confirm('Точно удалить все события?')) {
                schedule = [];
                saveSchedule();
                renderEvents();
                cancelEditing();
            }
        }

        // --- УВЕДОМЛЕНИЯ ЗА 10 МИНУТ ---
        function checkNotifications() {
            // если нет разрешения — не беспокоим
            if (Notification.permission !== 'granted') return;

            const now = new Date();
            const currentDay = now.getDay();       // 0 вс, 1 пн ...
            const currentHours = now.getHours();
            const currentMins = now.getMinutes();
            const currentTotalMins = currentHours * 60 + currentMins;

            // строка сегодняшнего дня для Map (YYYY-MM-DD)
            const todayStr = now.toISOString().slice(0, 10);

            schedule.forEach(event => {
                // проверяем день
                if (event.day !== currentDay) return;

                const startParts = event.start.split(':').map(Number);
                if (startParts.length !== 2) return;
                const startTotalMins = startParts[0] * 60 + startParts[1];

                // событие уже началось?
                if (currentTotalMins >= startTotalMins) return;

                // разница в минутах до начала
                const diff = startTotalMins - currentTotalMins;
                if (diff <= 10 && diff > 0) {
                    // проверяем, не отправляли ли уже сегодня для этого события
                    if (notifiedToday.get(event.id) === todayStr) return;

                    // показываем уведомление
                    const title = `🔔 Kira-txt · напоминание`;
                    const body = `«${event.title}» начнётся через ${diff} мин. (в ${event.start})`;
                    new Notification(title, { body, icon: '📅', silent: false });

                    // запоминаем, что сегодня уведомили
                    notifiedToday.set(event.id, todayStr);
                }
            });
        }

        // запускаем проверку каждые 60 секунд
        setInterval(checkNotifications, 60000);
        // и сразу после загрузки проверим (с небольшой задержкой, чтобы страница успела отрисоваться)
        setTimeout(checkNotifications, 2000);

        // --- ПОДПИСКА НА КНОПКИ ---
        addBtn.addEventListener('click', addEvent);
        updateBtn.addEventListener('click', updateEvent);
        cancelBtn.addEventListener('click', cancelEditing);
        clearAllBtn.addEventListener('click', clearAll);

        // при изменении расписания (добавление/удаление/обновление) сбрасываем уведомления?
        // Можно ничего не делать — Map notifiedToday привязывается к id, старые уведомления остаются,
        // но новые события получат свежие id, и для них уведомления сработают.
        // При редактировании события (меняем время) — мы оставляем тот же id, но уведомление сегодня
        // могло уже отправиться. Чтобы не пропустить новое время, удалим запись из notifiedToday
        // при обновлении события (через updateEvent). Сделаем это внутри updateEvent.

        // Переопределим updateEvent с учётом сброса уведомлений
        const originalUpdate = updateEvent;
        updateEvent = function() {
            if (editingId) {
                // удаляем запись об уведомлении для этого события (чтобы заново сработало, если время изменилось)
                notifiedToday.delete(editingId);
            }
            originalUpdate();
        };
        // аналогично для addEvent — новое событие ещё не уведомлялось, ок.
        // для deleteEvent — тоже удалим из notifiedToday
        const originalDelete = deleteEvent;
        deleteEvent = function(id) {
            notifiedToday.delete(id);
            originalDelete(id);
        };
        // для clearAll — сбросим всё
        const originalClear = clearAll;
        clearAll = function() {
            notifiedToday.clear();
            originalClear();
        };

        // переопределим функции в глобальной области видимости, чтобы обработчики использовали новые
        window.addEvent = addEvent;
        window.updateEvent = updateEvent;
        window.deleteEvent = deleteEvent;
        window.clearAll = clearAll;

        // подменим обработчики
        addBtn.removeEventListener('click', addEvent);
        addBtn.addEventListener('click', addEvent);
        updateBtn.removeEventListener('click', originalUpdate);
        updateBtn.addEventListener('click', updateEvent);
        clearAllBtn.removeEventListener('click', originalClear);
        clearAllBtn.addEventListener('click', clearAll);

        // старт
        loadSchedule();
        cancelEditing(); // на всякий случай синхронизация

        // небольшая помощь: если пользователь не дал разрешение на уведомления,
        // напомним при первом действии (но не агрессивно)
        setTimeout(() => {
            if (Notification.permission === 'default') {
                const remind = confirm('Kira-txt может присылать уведомления за 10 минут до событий. Разрешить?');
                if (remind) {
                    Notification.requestPermission();
                }
            }
        }, 1000);
    })();
</script>
</body>
</html>
