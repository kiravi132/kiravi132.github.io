<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>denis </title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        h1 {
            padding: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<h1>Моя галерея</h1>

<div class="gallery">
    <img src="ph1.jpg" alt="Фото 1">
    <img src="ph2.jpg" alt="Фото 2">
    <img src="ph3.jpg" alt="Фото 3">
</div>

</body>
</html>
