<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIRA · чат с GPT</title>
    <style>
        /* ========== ТЁМНАЯ ТЕМА (как и раньше) ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0b0f14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .chat-container {
            max-width: 900px;
            width: 100%;
            background: #1e2429;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #2f373f;
        }
        .header {
            background: #0f1419;
            color: #e8eaed;
            padding: 20px 24px;
            font-size: 26px;
            font-weight: 600;
            border-bottom: 1px solid #2e3a44;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header span {
            background: #2d9cdb;
            color: black;
            font-size: 14px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 40px;
            margin-left: auto;
        }
        .api-section {
            padding: 18px 20px;
            background: #1a2128;
            border-bottom: 1px solid #2a343e;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
        }
        .api-section label {
            color: #b0c4d9;
            font-weight: 500;
            font-size: 14px;
        }
        .api-section input[type="password"] {
            flex: 2;
            min-width: 240px;
            padding: 12px 16px;
            background: #0f171f;
            border: 1px solid #35424b;
            border-radius: 40px;
            color: #f0f4f8;
            font-size: 14px;
            outline: none;
        }
        .api-section input[type="password"]:focus {
            border-color: #2d9cdb;
            box-shadow: 0 0 0 2px rgba(45,156,219,0.3);
        }
        .api-section select {
            background: #0f171f;
            color: #e0e6ed;
            border: 1px solid #35424b;
            border-radius: 40px;
            padding: 12px 20px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }
        .api-section button {
            background: #2d9cdb;
            border: none;
            color: #111;
            font-weight: 600;
            padding: 12px 22px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .api-section button:hover {
            background: #2486c0;
        }
        .warning-badge {
            font-size: 12px;
            background: #3a2e2e;
            color: #f9b5a1;
            padding: 6px 14px;
            border-radius: 40px;
            border-left: 4px solid #e67e22;
        }
        .chat-box {
            height: 440px;
            overflow-y: auto;
            padding: 24px;
            background: #12181f;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 78%;
            padding: 12px 18px;
            border-radius: 24px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0.5; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message {
            align-self: flex-end;
            background: #2d9cdb;
            color: #fff;
            border-bottom-right-radius: 6px;
        }
        .assistant-message {
            align-self: flex-start;
            background: #26323f;
            color: #e9f0f5;
            border-bottom-left-radius: 6px;
        }
        .typing-indicator {
            align-self: flex-start;
            background: #1f2b36;
            color: #8da3b8;
            padding: 14px 22px;
            border-radius: 28px;
            font-style: italic;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .typing-indicator::after {
            content: '';
            width: 16px;
            height: 16px;
            border: 2px solid #5f7d9c;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .input-panel {
            background: #1a2128;
            border-top: 1px solid #2c3742;
            padding: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .input-panel input {
            flex: 1;
            padding: 15px 22px;
            background: #0f171f;
            border: 1px solid #30404d;
            border-radius: 60px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        .input-panel input:focus {
            border-color: #2d9cdb;
        }
        .input-panel input:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .input-panel button {
            background: #2d9cdb;
            border: none;
            color: #0b1a24;
            font-weight: 700;
            padding: 0 32px;
            border-radius: 60px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .input-panel button:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .input-panel .secondary-btn {
            background: #2f3e4e;
            color: #cbd5e0;
            padding: 0 22px;
        }
        .footer-note {
            padding: 14px 24px;
            background: #131b23;
            color: #7f8fa3;
            font-size: 12px;
            text-align: center;
            border-top: 1px solid #25313d;
        }
        .footer-note a {
            color: #5faee6;
            text-decoration: none;
        }
        .footer-note strong {
            color: #e0a87a;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="header">
        ⚡ KIRA
        <span>чат с GPT</span>
    </div>

    <div class="api-section">
        <label for="apiKey">🔑 API ключ OpenAI</label>
        <input type="password" id="apiKey" placeholder="sk-..." value="">
        <select id="modelSelect">
            <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
            <option value="gpt-4">GPT-4 (если доступ)</option>
            <option value="gpt-4-turbo">GPT-4 Turbo</option>
        </select>
        <button id="saveKeyBtn">💾 сохранить</button>
        <span class="warning-badge">ключ в localStorage</span>
    </div>

    <div id="chatBox" class="chat-box">
        <div class="message assistant-message">
            Привет! Введи ключ OpenAI, выбери модель и начни диалог.
        </div>
    </div>

    <div class="input-panel">
        <input type="text" id="userInput" placeholder="Напиши сообщение..." disabled>
        <button id="sendBtn" disabled>➤ отправить</button>
        <button id="newChatBtn" class="secondary-btn">🔄 новый диалог</button>
    </div>

    <div class="footer-note">
        ⚠️ <strong>Ключ хранится локально</strong>. Запросы идут через ваш прокси-сервер — CORS не блокирует.<br>
        🔧 Убедитесь, что в коде указан правильный URL прокси (переменная API_URL).
    </div>
</div>

<script>
    (function() {
        // ================== НАСТРОЙКИ ==================
        // Укажите здесь URL вашего прокси-сервера:
        // - для Vercel (относительный): '/api/proxy'
        // - для Render (абсолютный): 'https://your-proxy.onrender.com/v1/chat/completions'
        const API_URL = '/api/proxy';   // <--- ИЗМЕНИТЕ ПРИ НЕОБХОДИМОСТИ

        // ===============================================

        const apiKeyInput = document.getElementById('apiKey');
        const modelSelect = document.getElementById('modelSelect');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        const chatBox = document.getElementById('chatBox');

        let apiKey = '';
        let messagesHistory = [
            { role: 'system', content: 'Ты — KIRA, полезный, лаконичный и немного саркастичный ассистент. Отвечай на том же языке, что и пользователь.' }
        ];

        // Загрузка сохранённых данных
        function loadStoredSettings() {
            const storedKey = localStorage.getItem('kira_api_key');
            if (storedKey && storedKey.startsWith('sk-')) {
                apiKey = storedKey;
                apiKeyInput.value = storedKey;
                enableChat();
            }
            const storedModel = localStorage.getItem('kira_model');
            if (storedModel) modelSelect.value = storedModel;
        }

        function saveKeyToStorage(key) {
            localStorage.setItem('kira_api_key', key);
        }

        function saveModelToStorage(model) {
            localStorage.setItem('kira_model', model);
        }

        function enableChat() {
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        function addMessageToChat(role, text, isTyping = false) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', role === 'user' ? 'user-message' : 'assistant-message');
            if (isTyping) {
                messageDiv.classList.add('typing-indicator');
                messageDiv.textContent = 'KIRA печатает';
            } else {
                messageDiv.textContent = text;
            }
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return messageDiv;
        }

        function removeTypingIndicator() {
            const lastChild = chatBox.lastChild;
            if (lastChild && lastChild.classList.contains('typing-indicator')) {
                lastChild.remove();
            }
        }

        function resetChat() {
            chatBox.innerHTML = '';
            addMessageToChat('assistant', 'Привет! Введи ключ OpenAI, выбери модель и начни диалог.');
            messagesHistory = [
                { role: 'system', content: 'Ты — KIRA, полезный, лаконичный и немного саркастичный ассистент. Отвечай на том же языке, что и пользователь.' }
            ];
        }

        saveKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key && key.startsWith('sk-')) {
                apiKey = key;
                saveKeyToStorage(key);
                saveModelToStorage(modelSelect.value);
                enableChat();
                addMessageToChat('assistant', '✅ Ключ сохранён. Модель: ' + modelSelect.value);
            } else {
                alert('Введите корректный ключ OpenAI (начинается с sk-).');
            }
        });

        modelSelect.addEventListener('change', () => {
            if (apiKey) {
                saveModelToStorage(modelSelect.value);
                addMessageToChat('assistant', '⚙️ Модель изменена на ' + modelSelect.value);
            }
        });

        newChatBtn.addEventListener('click', resetChat);

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || !apiKey) return;

            addMessageToChat('user', text);
            messagesHistory.push({ role: 'user', content: text });

            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            addMessageToChat('assistant', 'KIRA печатает', true);

            try {
                const model = modelSelect.value;

                // Отправляем запрос на ПРОКСИ (без Authorization)
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: messagesHistory,
                        temperature: 0.8,
                        max_tokens: 800
                    })
                });

                removeTypingIndicator();

                if (!response.ok) {
                    let errorMsg = `Ошибка HTTP ${response.status}`;
                    try {
                        const errData = await response.json();
                        errorMsg = errData.error?.message || errorMsg;
                    } catch (e) {}
                    throw new Error(errorMsg);
                }

                const data = await response.json();
                const reply = data.choices[0].message.content;
                messagesHistory.push({ role: 'assistant', content: reply });
                addMessageToChat('assistant', reply);
            } catch (error) {
                removeTypingIndicator();
                let errorText = `❌ Ошибка: ${error.message}`;
                if (error.message.includes('Failed to fetch')) {
                    errorText = '❌ Не удалось связаться с прокси. Проверьте URL в переменной API_URL и доступность сервера.';
                }
                addMessageToChat('assistant', errorText);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
        });

        loadStoredSettings();
        if (!apiKey) {
            userInput.disabled = true;
            sendBtn.disabled = true;
        }
    })();
</script>
</body>
</html>
