<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>GPT Chat</title>
<style>
body{
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
#chat{
  width:400px;
  background:white;
  border-radius:10px;
  padding:15px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}
#messages{
  height:300px;
  overflow-y:auto;
  border:1px solid #ddd;
  padding:10px;
  margin-bottom:10px;
}
.message{
  margin-bottom:8px;
}
.user{color:blue;}
.bot{color:green;}
</style>
</head>
<body>

<div id="chat">
  <div id="messages"></div>
  <input id="input" type="text" placeholder="Напишите сообщение..." style="width:75%">
  <button onclick="send()">Отправить</button>
</div>

<script>
async function send(){
  const input=document.getElementById("input");
  const text=input.value;
  const messages=document.getElementById("messages");

  messages.innerHTML+=`<div class="message user">Вы: ${text}</div>`;

  const res=await fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text})
  });

  const data=await res.json();

  messages.innerHTML+=`<div class="message bot">GPT: ${data.reply}</div>`;
  input.value="";
}
</script>

</body>
</html>
