<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Рулетка 777</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Orbitron', monospace;
            padding: 20px;
        }

        .casino-container {
            max-width: 600px;
            width: 100%;
            background: rgba(10, 14, 23, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 3rem;
            padding: 2rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-align: center;
        }

        .slot-machine {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            margin: 2rem 0;
        }

        .reel {
            background: #11151f;
            width: 130px;
            height: 150px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.6), 0 12px 20px rgba(0,0,0,0.4), 0 0 0 2px rgba(255, 200, 50, 0.2);
            background: linear-gradient(145deg, #0b101a, #070b12);
        }

        .reel span {
            font-size: 5.5rem;
            font-weight: 800;
            font-family: 'Orbitron', monospace;
            color: #FFD966;
            text-shadow: 0 0 8px #ffaa33, 0 2px 4px black;
            display: inline-block;
        }

        .stop-pop {
            animation: finalPop 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        @keyframes finalPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); text-shadow: 0 0 15px gold; }
            100% { transform: scale(1); }
        }

        .spin-btn {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        button {
            background: radial-gradient(circle at 30% 10%, #FFB347, #E67E22);
            border: none;
            padding: 18px 45px;
            font-size: 1.8rem;
            font-weight: bold;
            font-family: 'Orbitron', monospace;
            color: #1e1a0c;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 10px 0 #9b4a0e, 0 5px 20px rgba(0,0,0,0.3);
            transition: 0.07s linear;
            width: 280px;
        }

        button:active {
            transform: translateY(5px);
            box-shadow: 0 5px 0 #9b4a0e;
        }

        button:disabled {
            opacity: 0.6;
            transform: translateY(0);
            cursor: not-allowed;
        }

        .reel-win {
            box-shadow: 0 0 0 3px #FFD700, inset 0 0 20px gold;
        }

        @media (max-width: 550px) {
            .reel {
                width: 85px;
                height: 100px;
            }
            .reel span {
                font-size: 3.6rem;
            }
            button {
                padding: 12px 25px;
                font-size: 1.4rem;
                width: 230px;
            }
        }
    </style>
</head>
<body>
<div class="casino-container">
    <div class="slot-machine">
        <div class="reel" id="reel1">
            <span id="num1">0</span>
        </div>
        <div class="reel" id="reel2">
            <span id="num2">0</span>
        </div>
        <div class="reel" id="reel3">
            <span id="num3">0</span>
        </div>
    </div>

    <div class="spin-btn">
        <button id="spinButton">🌀 SPIN 🌀</button>
    </div>
</div>

<script>
    (function() {
        const num1El = document.getElementById('num1');
        const num2El = document.getElementById('num2');
        const num3El = document.getElementById('num3');
        const spinBtn = document.getElementById('spinButton');
        const reels = [document.getElementById('reel1'), document.getElementById('reel2'), document.getElementById('reel3')];
        
        let isSpinning = false;
        let redirectTimeout = null;

        function getRandomNumber() {
            return Math.floor(Math.random() * 10);
        }

        function longSpinReel(reelElement, spanElement, finalValue, durationMs = 900, intervalMs = 55) {
            return new Promise((resolve) => {
                let intervalId = null;
                const startTime = performance.now();
                
                const updateRandom = () => {
                    const randomDigit = getRandomNumber();
                    spanElement.innerText = randomDigit;
                };
                
                intervalId = setInterval(updateRandom, intervalMs);
                
                const checkFinish = () => {
                    if (performance.now() - startTime >= durationMs) {
                        if (intervalId) clearInterval(intervalId);
                        spanElement.innerText = finalValue;
                        spanElement.classList.add('stop-pop');
                        reelElement.classList.add('reel-win');
                        setTimeout(() => {
                            spanElement.classList.remove('stop-pop');
                            reelElement.classList.remove('reel-win');
                        }, 250);
                        resolve();
                    } else {
                        requestAnimationFrame(checkFinish);
                    }
                };
                
                requestAnimationFrame(checkFinish);
            });
        }

        async function longSpinAll(finalNumbers) {
            const promises = [];
            for (let i = 0; i < 3; i++) {
                let reel = reels[i];
                let span = i === 0 ? num1El : (i === 1 ? num2El : num3El);
                promises.push(longSpinReel(reel, span, finalNumbers[i], 950, 55));
            }
            await Promise.all(promises);
        }

        function isJackpot(numbers) {
            return numbers[0] === 7 && numbers[1] === 7 && numbers[2] === 7;
        }

        function redirectToJackpotSite() {
            if (redirectTimeout) return;
            
            reels.forEach(reel => {
                reel.style.transition = 'box-shadow 0.2s';
                reel.style.boxShadow = '0 0 0 4px gold, 0 0 25px #ffaa33, inset 0 0 15px #ffcc44';
            });
            
            if (navigator.vibrate) navigator.vibrate(200);
            spinBtn.disabled = true;
            
            redirectTimeout = setTimeout(() => {
                window.location.href = 'https://kiravi132.github.io/qw';
            }, 1000);
        }

        function resetVisualEffects() {
            reels.forEach(reel => {
                reel.style.boxShadow = '';
                reel.style.transition = '';
            });
            if (redirectTimeout) {
                clearTimeout(redirectTimeout);
                redirectTimeout = null;
            }
        }

        async function onSpinClick() {
            if (isSpinning || spinBtn.disabled) return;
            
            resetVisualEffects();
            
            const finalNumbers = [
                getRandomNumber(),
                getRandomNumber(),
                getRandomNumber()
            ];
            
            isSpinning = true;
            spinBtn.disabled = true;
            
            await longSpinAll(finalNumbers);
            
            if (isJackpot(finalNumbers)) {
                redirectToJackpotSite();
                return;
            } else {
                isSpinning = false;
                spinBtn.disabled = false;
            }
        }
        
        spinBtn.addEventListener('click', onSpinClick);
        
        // начальные значения (не 777)
        num1El.innerText = '3';
        num2El.innerText = '5';
        num3El.innerText = '7';
    })();
</script>
</body>
</html>
